<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dat Portfolio</title>
    <script>
      // SPA redirect for GitHub Pages
      // Preserve path and query string, redirect to index.html
      const path = window.location.pathname + window.location.search
      window.location.replace('/?redirect=' + encodeURIComponent(path))
    </script>
  </head>
  <body></body>
</html>
